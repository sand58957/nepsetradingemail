# ===============================================================
# Global tuning (runs at http {} context — applies to all servers)
# ===============================================================

# Upstreams with keepalive (avoids new TCP handshake per request)
upstream frontend_app {
    server frontend:3000;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream backend_app {
    server backend:8080;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream listmonk_app {
    server listmonk:9000;
    keepalive 16;
}

# Cloudflare real-IP — strip CF proxy and use the real client IP
# Subset of Cloudflare's published IPv4 ranges (https://www.cloudflare.com/ips-v4)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

# Compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
# Serve pre-compressed *.gz assets when present (Next.js build output) instead of
# re-gzipping every request. (For Brotli, swap nginx:alpine for an image built with
# ngx_brotli and add: brotli on; brotli_static on; brotli_types ...;)
gzip_static on;
gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml application/xml+rss
    application/rss+xml application/atom+xml application/x-font-ttf
    image/svg+xml font/opentype font/woff font/woff2;

# HTTP-level proxy cache for selected routes
proxy_cache_path /var/cache/nginx/app
    levels=1:2
    keys_zone=app_cache:50m
    max_size=1g
    inactive=60m
    use_temp_path=off;

# Rate-limit zones (use real client IP, not the CF edge IP)
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=public_zone:10m rate=60r/s;

# Next.js router requests carry an RSC header AND a ?_rsc= cache-buster. A GET that
# has the header but no _rsc gets the text/x-component payload under the page's
# own URL, and Cloudflare caches that for everyone, crawlers included, so the page
# stops serving HTML. Drop the router headers on such requests so a page URL is
# always answered with HTML. POSTs (server actions) are untouched. An empty
# proxy_set_header value means the header is not sent upstream at all.
# nf_ prefix: other sites' configs share this http{} context.
map "$request_method:$arg__rsc" $nf_rsc_strip {
    "GET:"   1;
    "HEAD:"  1;
    default  0;
}
map $nf_rsc_strip $nf_fwd_rsc          { 1 ""; default $http_rsc; }
map $nf_rsc_strip $nf_fwd_state_tree   { 1 ""; default $http_next_router_state_tree; }
map $nf_rsc_strip $nf_fwd_prefetch     { 1 ""; default $http_next_router_prefetch; }
map $nf_rsc_strip $nf_fwd_seg_prefetch { 1 ""; default $http_next_router_segment_prefetch; }

# Better log format (timing for diagnostics)
log_format perf '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                'rt=$request_time urt=$upstream_response_time '
                'cs=$upstream_cache_status';

# ===============================================================
# HTTP -> HTTPS redirect (always to non-www)
# ===============================================================
server {
    listen 80;
    server_name nepalfillings.com www.nepalfillings.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://nepalfillings.com$request_uri;
    }
}

# ===============================================================
# HTTPS — www to non-www redirect
# ===============================================================
server {
    listen 443 ssl;
    http2 on;
    server_name www.nepalfillings.com;

    ssl_certificate     /etc/letsencrypt/live/nepalfillings.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nepalfillings.com/privkey.pem;

    return 301 https://nepalfillings.com$request_uri;
}

