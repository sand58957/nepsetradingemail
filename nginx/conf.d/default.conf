    location = /blog/future-of-marketing-in-nepal-messaging-apps-dominate-2026-1776057141 { return 301 /blog/future-of-marketing-in-nepal-messaging-apps-dominate-2026; }
    location = /blog/email-marketing-in-nepal-2026-complete-beginner-s-guide-for-nepali-businesses-1776057149 { return 301 /blog/email-marketing-in-nepal-2026-complete-beginner-s-guide-for-nepali-businesses; }
    location = /blog/15-proven-email-marketing-strategies-to-boost-sales-in-kathmandu-1776057157 { return 301 /blog/15-proven-email-marketing-strategies-to-boost-sales-in-kathmandu; }
    location = /blog/how-to-build-high-converting-email-lists-for-ecommerce-in-nepal-1776057165 { return 301 /blog/how-to-build-high-converting-email-lists-for-ecommerce-in-nepal; }


    # ---- 301s for URLs that never existed -------------------------------
    # The previous auto-publisher invented internal links to pages that were
    # never built; Google recorded 94 of them as Not found (404). These map
    # each invented path onto the real page a reader was looking for.
    # They used to point at /blog/category/whatsapp-marketing and similar
    # categories that don't exist, so every hop ended on a broken page. Each now
    # lands on the channel's guide.
    location = /blog/whatsapp-marketing-nepal { return 301 /blog/whatsapp-marketing-in-nepal-2026-full-strategy-guide; }
    location = /blog/whatsapp-marketing-nepal/ { return 301 /blog/whatsapp-marketing-in-nepal-2026-full-strategy-guide; }
    location = /blog/whatsapp-marketing { return 301 /blog/whatsapp-marketing-in-nepal-2026-full-strategy-guide; }
    location = /blog/whatsapp-marketing-strategy { return 301 /blog/whatsapp-marketing-in-nepal-2026-full-strategy-guide; }
    location = /blog/whatsapp-marketing-guide-nepal { return 301 /blog/whatsapp-marketing-in-nepal-2026-full-strategy-guide; }
    location = /blog/whatsapp-marketing-solutions-nepal { return 301 /blog/whatsapp-marketing-in-nepal-2026-full-strategy-guide; }
    location = /blog/whatsapp-business-api-nepal/ { return 301 /blog/whatsapp-marketing-in-nepal-2026-full-strategy-guide; }
    location = /blog/leveraging-whatsapp-marketing-in-nepal { return 301 /blog/whatsapp-marketing-in-nepal-2026-full-strategy-guide; }
    location = /blog/sms-marketing-nepal { return 301 /blog/bulk-sms-marketing-in-nepal-2026-complete-guide-pricing; }
    location = /blog/sms-marketing { return 301 /blog/bulk-sms-marketing-in-nepal-2026-complete-guide-pricing; }
    location = /blog/sms-marketing-strategies-for-nepali-businesses { return 301 /blog/bulk-sms-marketing-in-nepal-2026-complete-guide-pricing; }
    location = /blog/telegram-marketing { return 301 /blog/telegram-marketing-in-nepal-complete-guide-for-2026; }
    location = /blog/messenger-marketing { return 301 /blog/facebook-messenger-marketing-in-nepal-2026-full-guide; }
    location = /blog/email-marketing-nepal { return 301 /blog/email-marketing-in-nepal-2026-complete-beginner-s-guide-for-nepali-businesses; }
    location = /blog/email-marketing-nepal/ { return 301 /blog/email-marketing-in-nepal-2026-complete-beginner-s-guide-for-nepali-businesses; }
    location = /blog/email-marketing { return 301 /blog/email-marketing-in-nepal-2026-complete-beginner-s-guide-for-nepali-businesses; }
    location = /blog/email-marketing-strategies { return 301 /blog/email-marketing-in-nepal-2026-complete-beginner-s-guide-for-nepali-businesses; }
    location = /blog/email-marketing-in-nepal-a-comprehensive-guide { return 301 /blog/email-marketing-in-nepal-2026-complete-beginner-s-guide-for-nepali-businesses; }
    location = /blog/ai-smart-emails-vs-newsletters { return 301 /blog/email-marketing-in-nepal-2026-complete-beginner-s-guide-for-nepali-businesses; }
    location = /blog/content-marketing-nepal { return 301 /blog/category/digital-marketing; }
    # Contact used to redirect to the theme's marketplace help centre ("Where Is My
    # Purchase Code?"). Temporary (302) until a real contact page exists.
    location = /contact { return 302 /#contact-us; }
    location = /blog/contact-us { return 302 /#contact-us; }
    location = /front-pages/help-center { return 302 /#contact-us; }

    # ---- removed theme demo pages ---------------------------------------
    # A fake iPhone checkout, a card-and-password payment form, a marketplace help
    # article and the theme's auth/misc demos. Deliberately gone, so 410.
    location = /front-pages/checkout { return 410; }
    location = /front-pages/payment  { return 410; }
    location = /front-pages/help-center/article/how-to-add-product-in-cart { return 410; }
    location ~ ^/(?:(?:en|fr|ar)/)?pages/(?:auth|misc)(?:/|$) { return 410; }
    location = /features { return 301 /; }


    # Bing Webmaster Tools ownership proof. Bing fetches this exact path and
    # parses the user ID out of the XML.
    location = /BingSiteAuth.xml {
        default_type application/xml;
        return 200 '<?xml version="1.0"?><users><user>DD66996C13B0103AFFC9623FAE3883F4</user></users>';
    }

    # Google Search Console ownership proof. Google fetches this exact path and
    # expects the token line as plain text.
    location = /googled3a79611891021ae.html {
        default_type text/html;
        return 200 "google-site-verification: googled3a79611891021ae.html";
    }

    # IndexNow ownership proof for Bing. Serves the key as plain text so search
    # engines can verify submissions come from this domain.
    location = /373330630784332d3be948076f254426.txt {
        default_type text/plain;
        return 200 "373330630784332d3be948076f254426";
    }

    access_log /var/log/nginx/access.log perf;

    # ------ SSL / TLS ------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/nepalfillings.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nepalfillings.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling — saves a handshake round-trip for direct-to-origin clients.
    ssl_stapling on;
    ssl_stapling_verify on;
    # Docker's embedded DNS. Resolves container names and forwards external
    # lookups, so this serves both the proxy_pass targets below and OCSP.
    # valid=10s bounds how long a dead container IP can be cached.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Upstream hostnames as variables. A proxy_pass containing a variable is
    # re-resolved at request time, so a recreated container's new IP is picked up
    # within the resolver TTL instead of 502-ing until nginx is reloaded.
    #
    # Trade-off: a variable proxy_pass bypasses the upstream{} blocks at the top
    # of this file, so their `keepalive 32` no longer applies. Measured cost on
    # this host is roughly a millisecond per request. To revert, change the
    # proxy_pass lines below back to the upstream names (backend_app,
    # frontend_app, listmonk_app) and restore the public resolver above.
    set $frontend_up "frontend:3000";
    set $backend_up  "backend:8080";
    set $listmonk_up "listmonk:9000";

    # ------ Security headers (see security-headers.inc) ------
    include /etc/nginx/conf.d/security-headers.inc;

    # ------ General settings -----------------------------------
    client_max_body_size 50M;

    # Common proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Use HTTP/1.1 + close Connection header to engage upstream keepalive
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ------ NextAuth routes → Next.js frontend ------------------
    location ~ ^/api/auth/(session|providers|csrf|callback|signin|signout|error|_log) {
        proxy_pass http://$frontend_up;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # ------ Backend API (Go) -----------------------------------
    # Public read-mostly endpoints — short-cache at edge to absorb crawler traffic
    location ~ ^/api/public/(blog|sitemap)/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://$backend_up;
        proxy_cache app_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
        include /etc/nginx/conf.d/security-headers.inc;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ------ Bulk contact imports -------------------------------
    # A CSV of a hundred thousand contacts is a legitimately long request even
    # with batched inserts, and 60s killed one mid-write. Rate limiting is off
    # here because a single upload must not be counted against the burst that
    # ordinary API traffic shares.
    location ~ ^/api/(whatsapp|sms|telegram|messenger)/contacts/import$ {
        proxy_pass http://$backend_up;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering on;
    }

    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://$backend_up;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ------ Static text files at site root (cache at edge) ------
    # These are SEO/policy files served by Next.js but never change frequently.
    # Next.js sends its own Cache-Control on everything it serves, so each proxied
    # location below hides that one before adding its own; otherwise responses
    # carry two conflicting Cache-Control headers.
    location = /robots.txt {
        proxy_pass http://$frontend_up;
        proxy_cache app_cache;
        proxy_cache_valid 200 1d;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/conf.d/security-headers.inc;
        access_log off;
    }
    location = /ads.txt {
        proxy_pass http://$frontend_up;
        proxy_cache app_cache;
        proxy_cache_valid 200 1d;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/conf.d/security-headers.inc;
        access_log off;
    }
    location = /llms.txt {
        proxy_pass http://$frontend_up;
        proxy_cache app_cache;
        proxy_cache_valid 200 1d;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/conf.d/security-headers.inc;
        access_log off;
    }
    location = /sitemap.xml {
        proxy_pass http://$frontend_up;
        proxy_cache app_cache;
        proxy_cache_valid 200 1h;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # ------ Self-hosted blog featured images -------------------
    location /blog-images/ {
        alias /usr/share/nginx/blog-images/;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
        access_log off;
        try_files $uri =404;
    }

    # ------ Next.js static assets (long cache, immutable) ------
    location /_next/static/ {
        proxy_pass http://$frontend_up;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.inc;
        access_log off;
    }

    # ------ Site images (long cache) ---------------------------
    location /images/ {
        proxy_pass http://$frontend_up;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/conf.d/security-headers.inc;
        access_log off;
    }

    # ------ Blog HTML (short edge cache, stale-while-revalidate)
    location ^~ /blog {
        # Setting any header here drops every inherited one, which is why blog pages
        # used to ship without HSTS and the rest.
        include /etc/nginx/conf.d/security-headers.inc;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_set_header RSC                          $nf_fwd_rsc;
        proxy_set_header Next-Router-State-Tree       $nf_fwd_state_tree;
        proxy_set_header Next-Router-Prefetch         $nf_fwd_prefetch;
        proxy_set_header Next-Router-Segment-Prefetch $nf_fwd_seg_prefetch;

        limit_req zone=public_zone burst=80 nodelay;
        proxy_pass http://$frontend_up;
        proxy_cache app_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_read_timeout 60s;
    }

    # ------ Listmonk public routes (email tracking / webhooks) -
    location /subscription/ { proxy_pass http://$listmonk_up; }
    location /link/         { proxy_pass http://$listmonk_up; }
    location /campaign/     { proxy_pass http://$listmonk_up; }
    location /uploads/      { proxy_pass http://$listmonk_up; }
    location /archive       { proxy_pass http://$listmonk_up; }
    location /webhooks/     { proxy_pass http://$listmonk_up; }

    # ------ Frontend (Next.js catch-all) -----------------------
    location / {
        limit_req zone=public_zone burst=80 nodelay;
        proxy_pass http://$frontend_up;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header RSC                          $nf_fwd_rsc;
        proxy_set_header Next-Router-State-Tree       $nf_fwd_state_tree;
        proxy_set_header Next-Router-Prefetch         $nf_fwd_prefetch;
        proxy_set_header Next-Router-Segment-Prefetch $nf_fwd_seg_prefetch;
        proxy_read_timeout 60s;
    }
}
